name: ci
on:
  push:
  pull_request:
jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict agent and skill frontmatter
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          MODE_ALLOWLIST = {'subagent'}
          errors = []

          def frontmatter(path):
              text = path.read_text()
              if not text.startswith('---'):
                  return None
              parts = text.split('---', 2)
              if len(parts) < 3:
                  return None
              return parts[1]

          def field(head, key):
              m = re.search(rf'^{key}\s*:\s*(.+?)\s*$', head, re.M | re.I)
              return m.group(1).strip().strip('\'"') if m else None

          for f in sorted(pathlib.Path('.opencode/agents').glob('*.md')):
              head = frontmatter(f)
              if head is None:
                  errors.append(f'{f}: missing frontmatter block')
                  continue
              desc, mode = field(head, 'description'), field(head, 'mode')
              if not desc:
                  errors.append(f'{f}: missing description')
              elif not (10 <= len(desc) <= 200):
                  errors.append(f'{f}: description must be 10-200 chars (is {len(desc)})')
              if not mode:
                  errors.append(f'{f}: missing mode')
              elif mode not in MODE_ALLOWLIST:
                  errors.append(f'{f}: mode {mode!r} not in allowlist {sorted(MODE_ALLOWLIST)}')

          seen = {}
          for f in sorted(pathlib.Path('.opencode/skills').glob('*/SKILL.md')):
              head = frontmatter(f)
              if head is None:
                  errors.append(f'{f}: missing frontmatter block')
                  continue
              name, desc = field(head, 'name'), field(head, 'description')
              if not name:
                  errors.append(f'{f}: missing name')
              else:
                  if name != f.parent.name:
                      errors.append(f'{f}: name {name!r} must match directory {f.parent.name!r}')
                  if name in seen:
                      errors.append(f'{f}: duplicate skill name {name!r} (also {seen[name]})')
                  seen[name] = str(f)
              if not desc:
                  errors.append(f'{f}: missing description')
              elif not (10 <= len(desc) <= 200):
                  errors.append(f'{f}: description must be 10-200 chars (is {len(desc)})')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'frontmatter OK ({len(list(pathlib.Path(".opencode/agents").glob("*.md")))} agents, {len(seen)} skills)')
          EOF
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown hygiene (stdlib python, offline-safe)
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          errors = []
          files = [p for p in sorted(pathlib.Path('.').rglob('*.md')) if '.git/' not in str(p)]
          for f in files:
              lines = f.read_text().splitlines()
              in_fence = False
              prev_level = None
              blanks = 0
              for i, line in enumerate(lines, 1):
                  if re.match(r'^```', line):
                      if not in_fence and not re.match(r'^```\S', line):
                          errors.append(f'{f}:{i}: fenced code block missing language tag (use ```text etc.)')
                      in_fence = not in_fence
                      blanks = 0
                      continue
                  if in_fence:
                      continue
                  if line != line.rstrip(' \t'):
                      errors.append(f'{f}:{i}: trailing whitespace')
                  if line.strip() == '':
                      blanks += 1
                      if blanks > 1:
                          errors.append(f'{f}:{i}: multiple consecutive blank lines')
                  else:
                      blanks = 0
                  m = re.match(r'(#+)\s', line)
                  if m:
                      level = len(m.group(1))
                      if prev_level is not None and level > prev_level + 1:
                          errors.append(f'{f}:{i}: heading jumps h{prev_level} -> h{level}: {line.strip()[:60]}')
                      prev_level = level
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'markdown hygiene OK ({len(files)} files)')
          EOF
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec and template section compliance
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          # Substring match on purpose: accepts "Risks / open questions" and "Rollout / rollback".
          REQUIRED = ['problem', 'non-goal', 'users', 'acceptance criteria', 'risk', 'rollout']
          errors = []

          def check(path):
              text = path.read_text()
              headings = [h.lower() for h in re.findall(r'^#+\s*(.+)$', text, re.M)]
              missing = [r for r in REQUIRED if not any(r in h for h in headings)]
              if missing:
                  errors.append(f'{path}: missing sections: {", ".join(missing)} (need: Problem, Non-goals, Users, Acceptance criteria, Risks, Rollout)')
              low = text.lower()
              if not (re.search(r'\bgiven\b', low) and re.search(r'\bwhen\b', low) and re.search(r'\bthen\b', low)):
                  errors.append(f'{path}: Acceptance criteria must use Given/When/Then')

          specs = sorted(pathlib.Path('docs/specs').glob('*.md')) if pathlib.Path('docs/specs').is_dir() else []
          for spec in specs:
              check(spec)
          tmpl = pathlib.Path('docs/templates/spec-template.md')
          if tmpl.exists():
              check(tmpl)
          # NOTE: docs/templates/plan-template.md is intentionally exempt (slice plan shape, not a spec).
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'template compliance OK ({len(specs)} specs + spec-template)')
          EOF
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Routing integrity (refs resolve, no rogue gate verdicts)
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          errors = []
          skills = {p.parent.name for p in pathlib.Path('.opencode/skills').glob('*/SKILL.md')}
          agents = {p.stem for p in pathlib.Path('.opencode/agents').glob('*.md')}
          EXTERNAL = ('cointrader', 'mean-reversion-analyser')  # qualified refs live elsewhere
          files = [p for p in sorted(pathlib.Path('.').rglob('*.md')) if '.git/' not in str(p)]

          skill_pat = re.compile(r'\b(factory-[a-z0-9-]+|multi-perspective-review)\b')
          agent_pat = re.compile(r'\b([a-z0-9]+(?:-[a-z0-9]+)*-(?:manager|engineer|architect|trader|designer)|cto)\b')
          for f in files:
              for i, line in enumerate(f.read_text().splitlines(), 1):
                  if any(x in line.lower() for x in EXTERNAL):
                      continue
                  for tok in skill_pat.findall(line):
                      if tok not in skills:
                          errors.append(f'{f}:{i}: skill reference {tok!r} does not exist (.opencode/skills/{tok}/SKILL.md missing)')
                  for tok in agent_pat.findall(line):
                      if tok not in agents and tok not in skills:
                          errors.append(f'{f}:{i}: agent reference {tok!r} does not exist (.opencode/agents/{tok}.md missing)')

          # Gate-verdict authority: only factory-review may claim verdict power.
          verdict_pat = re.compile(r'\bapprove\b|\brequest[ _]changes\b|\bveto\b|\bapprove-for-live\b|gate verdict', re.I)
          claim_pat = re.compile(r'(this skill|\bi\b)\s+(will|shall|hereby|may|can)\s+[^.\n]{0,60}\b(approve|request changes|veto|verdict)', re.I)
          cue_pat = re.compile(r"must\s?not|never|do\s+not|don't|can'?t|cannot|sole|only|belongs|rout|factory-review|quality-engineer|risk-manager|advisor|finding|\bvs\b|instead|stays|remains|forbidden|prohibited|without|deny|denies|denied|rather than|\bno\b|\bnot\b|n\'t", re.I)
          for skill in sorted(pathlib.Path('.opencode/skills').glob('*/SKILL.md')):
              if skill.parent.name == 'factory-review':
                  continue
              lines = skill.read_text().splitlines()
              for i, line in enumerate(lines):
                  if claim_pat.search(line):
                      errors.append(f'{skill}:{i+1}: claims gate-verdict authority (reserved for factory-review): {line.strip()[:100]}')
                      continue
                  if verdict_pat.search(line):
                      prior = [l for l in lines[:i] if l.strip()][-3:]
                      context = ' '.join(prior + [line])
                      if not cue_pat.search(context):
                          errors.append(f'{skill}:{i+1}: gate-verdict language without routing/denial cue (route verdicts to factory-review): {line.strip()[:100]}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'routing integrity OK ({len(skills)} skills, {len(agents)} agents, verdict check passed)')
          EOF
